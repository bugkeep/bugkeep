name: Update merged PRs

on:
  schedule:
    # GitHub Actions cron is UTC. 16:00 UTC == 00:00 (Asia/Shanghai).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-merged-prs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render README section
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'EOF'
          const { execFileSync } = require("child_process");
          const fs = require("fs");

          const owner = process.env.PROFILE_OWNER;
          const currentRepository = String(process.env.CURRENT_REPOSITORY || "").toLowerCase();

          function ghJson(args) {
            const out = execFileSync("gh", args, {
              encoding: "utf8",
              stdio: ["ignore", "pipe", "inherit"],
            }).trim();
            return out ? JSON.parse(out) : [];
          }

          function parentNameWithOwner(parent) {
            if (!parent) return null;
            if (parent.nameWithOwner) return parent.nameWithOwner;
            if (parent.owner?.login && parent.name) {
              return `${parent.owner.login}/${parent.name}`;
            }
            return null;
          }

          function targetRepoFromUrl(url) {
            const match = String(url).match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)/);
            if (!match) return null;
            return {
              repo: `${match[1]}/${match[2]}`,
              number: Number(match[3]),
            };
          }

          const forks = ghJson([
            "repo",
            "list",
            owner,
            "--fork",
            "--limit",
            "200",
            "--json",
            "nameWithOwner,parent",
          ]);

          const upstreamRepos = [...new Set(
            forks.map((repo) => parentNameWithOwner(repo.parent)).filter(Boolean)
          )].sort((a, b) => a.localeCompare(b));

          const results = [];
          for (const upstreamRepo of upstreamRepos) {
            let prs = [];
            try {
              prs = ghJson([
                "pr",
                "list",
                "--repo",
                upstreamRepo,
                "--state",
                "merged",
                "--author",
                owner,
                "--limit",
                "100",
                "--json",
                "number,title,url,mergedAt,isCrossRepository",
              ]);
            } catch (error) {
              console.warn(`Skipping ${upstreamRepo}: ${error.message}`);
              continue;
            }

            for (const pr of prs) {
              const target = targetRepoFromUrl(pr.url);
              if (!target) continue;
              if (!pr.mergedAt) continue;
              if (!pr.isCrossRepository) continue;
              if (target.repo.toLowerCase() === currentRepository) continue;

              results.push({
                repo: target.repo,
                number: target.number,
                title: String(pr.title || "").replace(/\r?\n/g, " ").trim(),
                url: pr.url,
                mergedAt: pr.mergedAt,
              });
            }
          }

          const seen = new Set();
          const uniqueResults = results
            .sort((a, b) => new Date(b.mergedAt) - new Date(a.mergedAt))
            .filter((pr) => {
              if (seen.has(pr.url)) return false;
              seen.add(pr.url);
              return true;
            })
            .slice(0, 10);

          const lines =
            uniqueResults.length > 0
              ? uniqueResults.map((p) => {
                  const date = String(p.mergedAt).slice(0, 10);
                  return `- [${p.repo}#${p.number}](${p.url}) - ${p.title} (merged ${date})`;
                })
              : ["- _(no merged PRs found)_"];

          const markerStart = "<!--START_SECTION:merged_prs-->";
          const markerEnd = "<!--END_SECTION:merged_prs-->";
          const readmePath = "README.md";
          const readme = fs.readFileSync(readmePath, "utf8");
          const startIdx = readme.indexOf(markerStart);
          const endIdx = readme.indexOf(markerEnd);
          if (startIdx === -1 || endIdx === -1 || endIdx < startIdx) {
            throw new Error("README markers not found or invalid.");
          }

          const before = readme.slice(0, startIdx + markerStart.length);
          const after = readme.slice(endIdx);
          const next = `${before}\n${lines.join("\n")}\n${after}`;
          fs.writeFileSync(readmePath, next, "utf8");
          EOF

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update merged PRs"
          git push

