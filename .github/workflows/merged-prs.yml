name: Update merged PRs

on:
  schedule:
    # GitHub Actions cron is UTC. 16:00 UTC == 00:00 (Asia/Shanghai).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-merged-prs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render README sections
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          node <<'EOF'
          const { execFileSync } = require("child_process");
          const fs = require("fs");

          const owner = process.env.PROFILE_OWNER;
          const ownerPrefix = `${owner.toLowerCase()}/`;

          function ghJson(args) {
            const out = execFileSync("gh", args, {
              encoding: "utf8",
              stdio: ["ignore", "pipe", "inherit"],
            }).trim();
            return out ? JSON.parse(out) : {};
          }

          // ---- data ---------------------------------------------------------------

          function fetchMergedPRs() {
            const items = [];
            for (let page = 1; page <= 10; page += 1) {
              const res = ghJson([
                "api",
                `search/issues?q=author:${owner}+is:pr+is:merged&per_page=100&page=${page}`,
              ]);
              const batch = res.items || [];
              items.push(...batch);
              if (batch.length < 100 || items.length >= (res.total_count || 0)) break;
            }
            return items;
          }

          const seen = new Set();
          const prs = fetchMergedPRs()
            .map((it) => ({
              repo: String(it.repository_url || "").replace(
                "https://api.github.com/repos/",
                ""
              ),
              number: it.number,
              title: String(it.title || "").replace(/\r?\n/g, " ").trim(),
              url: it.html_url,
              mergedAt: (it.pull_request && it.pull_request.merged_at) || it.closed_at,
            }))
            .filter((p) => p.repo && p.url && p.mergedAt)
            .sort(
              (a, b) => new Date(b.mergedAt) - new Date(a.mergedAt) || b.number - a.number
            )
            .filter((p) => {
              if (seen.has(p.url)) return false;
              seen.add(p.url);
              return true;
            });

          // Only upstream merges are showcased: patches that landed in someone else's
          // repository. PRs merged inside the owner's own repos are left out, and the
          // token only sees public data, so private repos never leak in either.
          const showcasePRs = prs.filter(
            (p) => !p.repo.toLowerCase().startsWith(ownerPrefix)
          );

          const byRepo = new Map();
          for (const pr of showcasePRs) {
            if (!byRepo.has(pr.repo)) byRepo.set(pr.repo, []);
            byRepo.get(pr.repo).push(pr);
          }

          const upstreamRepos = [...byRepo.keys()].sort(
            (a, b) => byRepo.get(b).length - byRepo.get(a).length || a.localeCompare(b)
          );

          const upstreamCount = showcasePRs.length;

          // ---- rendering ----------------------------------------------------------

          const DESCRIPTIONS = {
            "casosorg/casos":
              "A Kubernetes-flavored local cloud OS, and my main upstream: App Store installs, worker nodes, certificates, RBAC, Services, storage, and the CI that guards them.",
            "casosorg/kine":
              "The etcd-compatible, MySQL-backed storage layer that CasOS builds on.",
            "AstrBotDevs/AstrBot":
              "An agentic chat platform — security and robustness fixes at the upload, image, and HTTP-client edges.",
          };

          // Collapse a repo table once it grows past this many rows.
          const UPSTREAM_COLLAPSE_THRESHOLD = 20;

          const esc = (s) => s.replace(/\|/g, "\\|");
          const dateOf = (p) => String(p.mergedAt).slice(0, 10);

          function simpleTable(list) {
            const rows = list.map(
              (p) => `| [#${p.number}](${p.url}) | ${esc(p.title)} | ${dateOf(p)} |`
            );
            return ["| PR | Change | Merged |", "| --- | --- | --- |", ...rows].join("\n");
          }

          function repoTable(list) {
            const rows = list.map(
              (p) =>
                `| [${p.repo}](https://github.com/${p.repo}) | [#${p.number}](${p.url}) | ${esc(p.title)} | ${dateOf(p)} |`
            );
            return [
              "| Repository | PR | Change | Merged |",
              "| --- | --- | --- | --- |",
              ...rows,
            ].join("\n");
          }

          function repoSection(repo, list) {
            const lines = [
              `#### [${repo}](https://github.com/${repo}) · ${list.length} merged`,
            ];
            if (DESCRIPTIONS[repo]) {
              lines.push("", `> ${DESCRIPTIONS[repo]}`);
            }
            lines.push("");
            if (list.length > UPSTREAM_COLLAPSE_THRESHOLD) {
              lines.push(
                "<details>",
                `<summary><b>All ${list.length} merged PRs</b></summary>`,
                "",
                simpleTable(list),
                "",
                "</details>"
              );
            } else {
              lines.push(simpleTable(list));
            }
            return lines.join("\n");
          }

          const out = [];
          out.push(
            "The number I watch on GitHub is not stars. It is the patches a maintainer",
            `read, trusted, and merged — **${upstreamCount} so far, across ${upstreamRepos.length} upstream repositories**.`
          );

          if (upstreamCount > 0) {
            out.push("", `### Upstream & Open Source · ${upstreamCount}`);
            const multi = upstreamRepos.filter((r) => byRepo.get(r).length > 1);
            const singlePRs = upstreamRepos
              .filter((r) => byRepo.get(r).length === 1)
              .flatMap((r) => byRepo.get(r))
              .sort((a, b) => new Date(b.mergedAt) - new Date(a.mergedAt));
            for (const repo of multi) {
              out.push("", repoSection(repo, byRepo.get(repo)));
            }
            if (singlePRs.length > 0) {
              out.push(
                "",
                `#### One-Patch Stops · ${singlePRs.length}`,
                "",
                "> Small, sharp fixes in tools I actually use.",
                "",
                repoTable(singlePRs)
              );
            }
          } else {
            out.push("", "_(no upstream merged PRs found yet)_");
          }

          out.push(
            "",
            "### Live Feed — Freshest Merges",
            "",
            "_Updated nightly by [a small GitHub Actions workflow](https://github.com/bugkeep/bugkeep/blob/master/.github/workflows/merged-prs.yml)._",
            ""
          );
          const feed = showcasePRs.slice(0, 10);
          out.push(
            feed.length > 0
              ? feed
                  .map(
                    (p) =>
                      `- [${p.repo}#${p.number}](${p.url}) - ${p.title} (merged ${dateOf(p)})`
                  )
                  .join("\n")
              : "- _(no merged PRs found)_"
          );

          const badges = [
            `![upstream PRs](https://img.shields.io/badge/upstream_PRs-${upstreamCount}-238636?style=flat-square&logo=github&logoColor=white)`,
            `![upstream repos](https://img.shields.io/badge/upstream_repos-${upstreamRepos.length}-1F6FEB?style=flat-square&logo=github&logoColor=white)`,
          ].join("\n");

          // ---- splice -------------------------------------------------------------

          function replaceSection(readme, name, content) {
            const start = `<!--START_SECTION:${name}-->`;
            const end = `<!--END_SECTION:${name}-->`;
            const si = readme.indexOf(start);
            const ei = readme.indexOf(end);
            if (si === -1 || ei === -1 || ei < si) {
              throw new Error(`README markers for section "${name}" not found or invalid.`);
            }
            return `${readme.slice(0, si + start.length)}\n${content}\n${readme.slice(ei)}`;
          }

          const readmePath = "README.md";
          let readme = fs.readFileSync(readmePath, "utf8");
          readme = replaceSection(readme, "merged_prs_showcase", out.join("\n"));
          readme = replaceSection(readme, "merged_pr_stats", badges);
          fs.writeFileSync(readmePath, readme, "utf8");
          EOF

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update merged PR showcase"
          git push
