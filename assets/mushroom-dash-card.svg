<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Mushroom Dash mini game</title>
  <desc id="desc">A pixel platform game card with a press start button.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#111827"/>
    </filter>
  </defs>
  <rect width="980" height="260" fill="#111827"/>
  <rect x="16" y="16" width="948" height="228" fill="url(#sky)" stroke="#facc15" stroke-width="6"/>
  <rect x="16" y="188" width="948" height="56" fill="#92400e"/>
  <rect x="16" y="178" width="948" height="22" fill="#22c55e"/>
  <g opacity="0.9" fill="#fff">
    <rect x="84" y="58" width="88" height="24"/>
    <rect x="106" y="34" width="42" height="58"/>
    <rect x="660" y="72" width="118" height="26"/>
    <rect x="690" y="46" width="48" height="62"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="58" y="52" width="102" height="102" fill="#ef4444"/>
    <rect x="82" y="28" width="58" height="34" fill="#ef4444"/>
    <rect x="82" y="78" width="58" height="42" fill="#f97316"/>
    <rect x="64" y="118" width="92" height="42" fill="#2563eb"/>
    <rect x="126" y="86" width="12" height="12" fill="#111827"/>
  </g>
  <g>
    <rect x="300" y="128" width="54" height="54" fill="#c65f2f" stroke="#111827" stroke-width="6"/>
    <rect x="354" y="128" width="54" height="54" fill="#c65f2f" stroke="#111827" stroke-width="6"/>
    <rect x="408" y="128" width="54" height="54" fill="#c65f2f" stroke="#111827" stroke-width="6"/>
    <rect x="734" y="116" width="72" height="72" fill="#16a34a" stroke="#111827" stroke-width="6"/>
    <rect x="720" y="98" width="100" height="28" fill="#22c55e" stroke="#111827" stroke-width="6"/>
  </g>
  <g fill="#facc15" stroke="#111827" stroke-width="5">
    <ellipse cx="498" cy="100" rx="16" ry="24"/>
    <ellipse cx="548" cy="86" rx="16" ry="24"/>
    <ellipse cx="598" cy="100" rx="16" ry="24"/>
  </g>
  <text x="214" y="72" fill="#111827" font-family="'Courier New', monospace" font-size="28" font-weight="900">PIXEL PLATFORMER</text>
  <text x="214" y="115" fill="#111827" font-family="'Courier New', monospace" font-size="62" font-weight="900">MUSHROOM DASH</text>
  <text x="214" y="154" fill="#111827" font-family="'Courier New', monospace" font-size="22" font-weight="700">A/D move · W/Space jump · R restart</text>
  <g>
    <rect x="214" y="178" width="242" height="44" fill="#facc15" stroke="#111827" stroke-width="5"/>
    <text x="244" y="208" fill="#111827" font-family="'Courier New', monospace" font-size="24" font-weight="900">PRESS START</text>
  </g>
